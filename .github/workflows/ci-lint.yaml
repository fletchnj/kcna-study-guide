name: Kubernetes Manifests & Lint CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.7"
          echo "Installing Kubeconform ${KUBECONFORM_VERSION}..."
          curl -sL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate Kubernetes Manifests with Kubeconform
        run: |
          echo "Validating all Kubernetes manifests against Kubernetes 1.30.0 schema..."
          find . -name "*.yaml" -not -path "./.github/*" | xargs kubeconform -summary -verbose -strict -kubernetes-version 1.30.0
