apiVersion: v1
kind: Pod
metadata:
  name: startup-probe-demo
  labels:
    app: slow-boot-app
spec:
  containers:
    - name: legacy-service
      image: busybox:1.36
      args:
        - /bin/sh
        - -c
        - |
          echo "Simulating heavy initialization (loading database cache)..."
          sleep 25
          touch /tmp/app-initialized
          echo "Initialization finished! Main process running."
          sleep 3600
      # KCNA Exam Highlight:
      # The Startup Probe disables Liveness and Readiness probes until it succeeds.
      # This provides a flexible warm-up time (e.g. failureThreshold * periodSeconds = 30 * 2 = 60s)
      # without compromising fast failure detection once running.
      startupProbe:
        exec:
          command:
            - cat
            - /tmp/app-initialized
        periodSeconds: 2
        failureThreshold: 30

      livenessProbe:
        exec:
          command:
            - cat
            - /tmp/app-initialized
        periodSeconds: 5
        failureThreshold: 3
