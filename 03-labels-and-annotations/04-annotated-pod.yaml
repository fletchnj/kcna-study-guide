apiVersion: v1
kind: Pod
metadata:
  name: annotated-service-pod
  labels:
    app: api-gateway
    env: staging
  # KCNA Exam Highlight:
  # Annotations are for NON-identifying metadata and external tools.
  # Unlike labels, annotations:
  # 1. CANNOT be selected using kubectl -l or Service selectors.
  # 2. Can contain structured data, URLs, JSON, and large text.
  # 3. Are used by Ingress controllers, Prometheus, Istio, CI/CD tools.
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"
    build.git/commit-sha: "7a8b9c0d1e2f3a4b5c6d"
    maintainer.contact: "cloud-native-team@example.com"
    documentation.url: "https://kcna.example.com/docs/api-gateway"
    deployment.kubernetes.io/revision: "4"
    config.checksum/audit: '{"checksum":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}'
spec:
  containers:
    - name: gateway
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
