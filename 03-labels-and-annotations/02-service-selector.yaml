apiVersion: v1
kind: Service
metadata:
  name: backend-production-service
  labels:
    app.kubernetes.io/name: order-service
spec:
  type: ClusterIP
  # KCNA Exam Highlight:
  # The Service selector uses equality-based matching.
  # Traffic will ONLY route to Pods containing BOTH labels: app=backend AND env=prod.
  selector:
    app: backend
    env: prod
  ports:
    - name: http
      port: 80
      targetPort: 80
