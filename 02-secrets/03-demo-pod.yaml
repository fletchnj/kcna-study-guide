apiVersion: v1
kind: Pod
metadata:
  name: secret-demo-pod
  labels:
    app.kubernetes.io/name: kcna-secrets-demo
    tier: security-test
spec:
  restartPolicy: Never
  containers:
    - name: secret-consumer
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          echo "=== 1. Injected Secrets via Environment Variables ==="
          echo "Database User: $DB_USERNAME"
          echo "Database Password: $DB_PASSWORD"
          echo "API Token: $API_TOKEN"
          echo ""
          echo "=== 2. Secrets Mounted as Files (tmpfs) ==="
          echo "Directory listing of /etc/tls-certs with permissions:"
          ls -la /etc/tls-certs
          echo ""
          echo "First 2 lines of TLS certificate:"
          head -n 2 /etc/tls-certs/tls.crt
          echo ""
          echo "Sleeping to allow interactive inspection..."
          sleep 3600
      env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: API_KEY

      volumeMounts:
        - name: tls-certs-volume
          mountPath: /etc/tls-certs
          readOnly: true

  volumes:
    - name: tls-certs-volume
      secret:
        secretName: web-tls-cert
        # KCNA Security Best Practice: Restrict file permissions using defaultMode (0400 = read-only owner)
        defaultMode: 0400
