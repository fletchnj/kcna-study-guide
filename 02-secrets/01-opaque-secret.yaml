apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  labels:
    app.kubernetes.io/name: kcna-secrets-demo
    app.kubernetes.io/part-of: kcna-study-guide
type: Opaque
# KCNA Exam Highlight:
# You can define Secrets using 'data' (requires Base64-encoded strings)
# OR 'stringData' (accepts plain text and the API server base64-encodes it on write).
# Note: 'stringData' is write-only; when read back with kubectl, it always appears in 'data'.
data:
  # "postgres_admin" base64 encoded
  DB_USER: cG9zdGdyZXNfYWRtaW4=
  # "KCNA_Secret_P@ssw0rd!2026" base64 encoded
  DB_PASSWORD: S0NOQV9TZWNyZXRfUEBzc3cwcmQhMjAyNg==
stringData:
  # stringData allows human-readable definitions without manual base64 encoding
  API_KEY: "secret-token-xyz-98765"
