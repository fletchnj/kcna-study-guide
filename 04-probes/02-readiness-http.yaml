apiVersion: v1
kind: Pod
metadata:
  name: readiness-http-demo
  labels:
    app: readiness-demo
    tier: web
spec:
  containers:
    - name: web-server
      image: nginx:1.25-alpine
      lifecycle:
        postStart:
          exec:
            command:
              - /bin/sh
              - -c
              - |
                echo "Ready to accept traffic" > /usr/share/nginx/html/ready.html
      # KCNA Exam Highlight:
      # Readiness probes determine if the container is ready to accept user traffic.
      # If the readiness probe fails:
      # 1. The container is NOT killed or restarted.
      # 2. The Pod's IP is REMOVED from the endpoints of any matching Services.
      readinessProbe:
        httpGet:
          path: /ready.html
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5
        failureThreshold: 2
        successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-service
spec:
  selector:
    app: readiness-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
